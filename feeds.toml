# 天玑 8400-Ultra 与 9300 同代，CPU 拓扑不同（8xA725 vs 4xX4+4xA720），
# CPU/topology 相关资源迟早要 fork 出 UniXNU-mt6999-common（或等确认芯片编号后命名）。
