schema_version = 1

[device]
name = "rodin"
soc = "MT6899"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi Turbo 4 (rodin, Dimensity 8400-Ultra / MT6899) port. Baseline: rothko (K70 Ultra, MT6989). Hardware inventory largely filled from HyperOS 3.0.305.0 package (PGPT_UFS / vendor_boot DTB / dtbo)."

# 各区域记录：status = planned → implemented → host-verified → device-verified
# 每条 finding / limit / next_action 都要写实际观察，不写推测。

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**"]
inputs = ["SoC 型号确认、stock DTS、内存版本（见 docs/hardware-inventory.md）"]
configuration = ["TODO: 填入 board.toml 字段、DTS 属性与 defconfig 值"]
procedure = ["TODO: 记录实际执行的配置命令"]
findings = ["TODO"]
completion = ["所有 source pin 可解析；status 显示预期的覆盖与补丁顺序"]
limits = ["硬件输入未收集"]
next_action = ["按 docs/hardware-inventory.md 收集配置输入"]
evidence = []

[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["proprietary-files.txt", "board.toml", ".github/workflows/**", "docs/device-proc-iomem.txt", "docs/hardware-inventory.md"]
inputs = ["官方线刷包、UEFI fork（nvhv460-sketch/Silicium-Rothko，已 add rodinPkg）、lk/preloader 日志"]
configuration = ["external_repository=https://github.com/nvhv460-sketch/Silicium-Rothko.git; config=rodin; dsc=Platforms/Xiaomi/rodinPkg/rodin.dsc; fd=Build/rodinPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd; defines ENABLE_SECUREBOOT=0 DEVICE_MODEL=0 MEMORY_PROTECTION=TRUE SHIP_MODE=FALSE; submodules Mu_Basecore/Common/Mu/Common/Mu_OEM_Sample（linux.yml checkout 不带子模块）; packages 含 Silicon/Silicium + Silicon/MediaTek + Platforms/Xiaomi + Common/Mu(_OEM_Sample) + Mu_Basecore，因 EDK2 !include 沿 PACKAGES_PATH 解析"]
procedure = ["TODO: GitHub Actions Linux full build (steps=full, uefi_repository=nvhv460-sketch/Silicium-Rothko) 产出 SILICIUM_UEFI.fd；再 fastboot boot"]
findings = ["MT6899 SoC mmio 全部与 rothko (MT6989) 一致：GIC 0x0C400000/0x0C440000，watchdog 0x1C00B000，pinctrl 0x10005000，PMIF 0x1CC04000，UFS PHY/HCI 0x112A0000/0x112B0000；DSC0@0x14206000、DSI0@0x1420a000、MUTEX/DISPSYS/MMSYS/OVLSYS 地址均相同。面板 o10_42_02_0a_dsc_vdo_lcm_drv，1220x2712 stride 1248，32bpp；LK 帧缓冲 atag,videolfb = 0xFCC20000/0x33D0000，真机实测验证。RodinHighMemDxe 使用 rodin 实际 12GiB 单段布局。MemoryMapLib v1 保守映射低段 124MiB 固件区+所有 MMIO+LK handoff 结构（DTB 0x47C80000、initrd 0x66F00000、Display Reserved 0xFCC20000）。高段至 0xC0000000 从 live iomem 转录。DSI mode 为 VDO（非 rothko CMD），现有 mode-check 路径自动跳过 command-mode push，GOP 通过 LK framebuffer 发布。"]
completion = ["固件构建通过，进入 DarwinBoot，发布 framebuffer，保持内存契约"]
limits = ["首次 fastboot boot 尚未执行；高段 0xC0..0x33FF 内存未验证；payload trust cache 待填充"]
next_action = ["触发 github workflow 'Linux full build' steps=full，下载 .fd 产物，fastboot boot"]

[[area.evidence]]
kind = "source"
reference = "docs/device-proc-iomem.txt"
result = "真机 /proc/iomem 全量（2026-11-14）：System RAM/保留区用于 MemoryMapLib v1 自由区与保留区转录，以及 RodinHighMemDxe 高段范围"

[[area.evidence]]
kind = "source"
reference = "docs/hardware-inventory.md"
result = "GIC 0x0C400000/0x0C440000、watchdog 0x1C00B000、UFS 0x112A/0x112B0000、面板 o10_42_02_0a_dsc_vdo 与 rothko 完全一致；hwcode 0x6899、DRAM 12GiB 单段"

[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "[firmware] external_repository/config/dsc/fd 指向 nvhv460-sketch/Silicium-Rothko + rodinPkg，CLANGPDB 输出路径与 UniXNU firmware.py 硬编码工具链一致"

